<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Templetasi Administrasi RT-Ku Terbaik (13 Form)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { background-color: #eef2f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .topbar { background: linear-gradient(135deg, #154360 0%, #1f618d 60%, #2980b9 100%); color: #fff; padding: 14px 20px; }
        .sidebar-card { position: sticky; top: 15px; max-height: calc(100vh - 30px); overflow-y: auto; }
        .form-nav-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 9px 12px; border-radius: 6px; margin-bottom: 5px;
            cursor: pointer; border: 1px solid #dee2e6; background: #fff;
            font-size: 0.87rem; transition: all 0.15s ease;
        }
        .form-nav-item:hover { background: #ebf5fb; border-color: #2980b9; }
        .form-nav-item.active { background: #1f618d; color: #fff; border-color: #154360; font-weight: 600; }
        .form-nav-item.active .text-muted { color: #d6eaf8 !important; }
        .check-badge { font-size: 1rem; }

        /* Lembar Kertas Dokumen */
        .paper-sheet {
            background: #fff; padding: 35px 42px; border-radius: 6px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            font-family: 'Times New Roman', Times, serif; font-size: 12pt; color: #000;
            line-height: 1.45;
        }
        .kop-surat {
            text-align: center; border-bottom: 3px double #000;
            padding-bottom: 8px; margin-bottom: 18px;
        }
        .kop-surat h4 { margin: 0; font-weight: bold; text-transform: uppercase; font-size: 14pt; letter-spacing: 0.5px; }
        .kop-surat p { margin: 2px 0 0 0; font-size: 11pt; }
        .doc-title { text-align: center; font-weight: bold; text-transform: uppercase; margin-bottom: 16px; }
        .doc-title div { margin-bottom: 2px; }

        /* Panduan Pengisian (Hanya tampil di layar, hilang saat print) */
        .hint-guide {
            display: inline-block; font-family: 'Segoe UI', sans-serif;
            font-size: 0.72rem; color: #0d6efd; background: #e8f4fd;
            border: 1px solid #b6d4fe; border-radius: 4px;
            padding: 1px 6px; margin-left: 4px; vertical-align: middle;
        }
        .hint-block {
            font-family: 'Segoe UI', sans-serif; font-size: 0.75rem;
            color: #084298; background: #cfe2ff; border-left: 3px solid #0d6efd;
            padding: 4px 8px; margin-bottom: 4px; border-radius: 0 4px 4px 0;
        }

        /* Input menyatu dengan kertas tanpa shadow/placeholder */
        .paper-input {
            border: none; border-bottom: 1px dotted #555; background: #f8fbff;
            font-family: inherit; font-size: inherit; color: #000; padding: 1px 4px;
            outline: none; box-shadow: none !important;
        }
        .paper-input:focus { background: #e8f4fd; border-bottom: 1px solid #0d6efd; }
        .paper-textarea {
            width: 100%; border: 1px dashed #999; background: #f8fbff;
            font-family: inherit; font-size: inherit; color: #000; padding: 5px 8px;
            resize: vertical; box-shadow: none !important;
        }
        .paper-textarea:focus { background: #e8f4fd; border-color: #0d6efd; outline: none; }

        /* Tabel Dokumen & Kolom Resizable */
        .doc-table { width: 100%; border-collapse: collapse; margin: 8px 0 12px 0; font-size: 10pt; table-layout: auto; }
        .doc-table th, .doc-table td {
            border: 1px solid #000; padding: 4px 5px; vertical-align: middle;
            word-wrap: break-word; overflow-wrap: break-word;
        }
        .doc-table th {
            background-color: #f2f2f2; text-align: center; font-weight: bold;
            position: relative;
        }
        .th-resizable {
            resize: horizontal; overflow: auto; min-width: 45px; max-width: 100%;
            display: block; width: 100%;
        }
        .cell-area {
            width: 100%; border: none; background: transparent;
            font-family: inherit; font-size: inherit; color: #000;
            padding: 2px; resize: none; overflow: hidden;
            display: block; min-height: 24px; line-height: 1.3;
            box-shadow: none !important;
        }
        .cell-area:focus { background: #e8f4fd; outline: none; }

        .materai-box {
            border: 1px dashed #666; width: 95px; height: 55px; margin: 6px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 8.5pt; color: #555; text-align: center;
        }
        .foto-slot { border: 1px solid #000; padding: 10px; margin-bottom: 12px; position: relative; }
        .foto-preview {
            width: 100%; border: 1px dashed #aaa;
            display: flex; align-items: center; justify-content: center; background: #fafafa;
            margin-bottom: 6px; overflow: hidden;
        }
        .foto-preview img { width: 100%; height: 100%; object-fit: contain; }

        /* Mode Cetak / PDF */
        @media print {
            body { background: #fff !important; }
            .no-print, .hint-guide, .hint-block, .btn-add-row, .btn-del-row, input[type="file"], .foto-controls {
                display: none !important;
            }
            .col-lg-9 { width: 100% !important; max-width: 100% !important; flex: 0 0 100% !important; }
            .paper-sheet { box-shadow: none !important; padding: 0 !important; margin: 0 !important; }
            .paper-input { background: transparent !important; border-bottom: 1px dotted #000 !important; }
            .paper-textarea { background: transparent !important; border: none !important; padding: 0 !important; resize: none !important; }
            .th-resizable { resize: none !important; overflow: visible !important; }
            .table-responsive { overflow: visible !important; }
            .doc-table { font-size: 8.5pt !important; width: 100% !important; }
            .doc-table th, .doc-table td { padding: 3px 4px !important; }
            .foto-preview { border: none !important; background: transparent !important; }
        }
    </style>
    <style id="dynamic_print_orientation"></style>
</head>
<body>

<div class="topbar shadow-sm no-print">
    <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
            <h5 class="mb-0 fw-bold"><i class="fas fa-file-signature me-2"></i>Sistem Templetasi Administrasi RT-Ku Terbaik</h5>
            <small class="opacity-75">13 Formulir Standar Juknis | Kabupaten Kutai Kartanegara</small>
        </div>
        <div class="d-flex gap-2">
            <span class="badge bg-light text-dark d-flex align-items-center px-3" id="progress_summary">Selesai: 0 / 13 Form</span>
            <button class="btn btn-sm btn-warning fw-bold" onclick="resetAllData()"><i class="fas fa-rotate-left me-1"></i>Reset Semua</button>
        </div>
    </div>
</div>

<div class="container-fluid py-3">
    <div class="row g-3">
        <!-- SIDEBAR KIRI: IDENTITAS KOP & NAVIGASI 13 FORM -->
        <div class="col-lg-3 no-print">
            <div class="sidebar-card">
                <div class="card border-0 shadow-sm mb-3">
                    <div class="card-header bg-primary text-white fw-bold py-2 small">
                        <i class="fas fa-building me-1"></i> Identitas Kop & Pengurus RT
                    </div>
                    <div class="card-body p-2 small">
                        <div class="row g-1 mb-1">
                            <div class="col-4">
                                <label class="fw-bold mb-0">No. RT</label>
                                <input type="text" id="g_rt" class="form-control form-control-sm" oninput="syncGlobal()">
                            </div>
                            <div class="col-8">
                                <label class="fw-bold mb-0">Desa / Kelurahan</label>
                                <input type="text" id="g_desa" class="form-control form-control-sm" oninput="syncGlobal()">
                            </div>
                        </div>
                        <div class="mb-1">
                            <label class="fw-bold mb-0">Alamat Sekretariat RT</label>
                            <input type="text" id="g_alamat" class="form-control form-control-sm" oninput="syncGlobal()">
                        </div>
                        <div class="row g-1 mb-1">
                            <div class="col-6">
                                <label class="fw-bold mb-0">Kecamatan</label>
                                <input type="text" id="g_kec" class="form-control form-control-sm" oninput="syncGlobal()">
                            </div>
                            <div class="col-6">
                                <label class="fw-bold mb-0">Tempat Surat</label>
                                <input type="text" id="g_tempat" class="form-control form-control-sm" oninput="syncGlobal()">
                            </div>
                        </div>
                        <div class="mb-1">
                            <label class="fw-bold mb-0">Nama Ketua RT</label>
                            <input type="text" id="g_ketua" class="form-control form-control-sm" oninput="syncGlobal()">
                        </div>
                        <div class="row g-1">
                            <div class="col-6">
                                <label class="fw-bold mb-0">Sekretaris RT</label>
                                <input type="text" id="g_sekretaris" class="form-control form-control-sm" oninput="syncGlobal()">
                            </div>
                            <div class="col-6">
                                <label class="fw-bold mb-0">Bendahara RT</label>
                                <input type="text" id="g_bendahara" class="form-control form-control-sm" oninput="syncGlobal()">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-dark text-white fw-bold py-2 small">
                        <i class="fas fa-list-check me-1"></i> Daftar 13 Formulir
                    </div>
                    <div class="card-body p-2" id="nav_list"></div>
                </div>
            </div>
        </div>

        <!-- AREA KANAN: TOOLBAR & LEMBAR FORM -->
        <div class="col-lg-9">
            <div class="card border-0 shadow-sm mb-2 no-print">
                <div class="card-body py-2 px-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div>
                        <span class="fw-bold text-primary" id="active_form_title">FORM 1</span>
                        <span class="ms-2 badge" id="active_form_status">Belum Lengkap</span>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-success d-none" id="btn_export_xlsx" onclick="exportCurrentExcel()">
                            <i class="fas fa-file-excel me-1"></i>Export Excel (.xlsx)
                        </button>
                        <button class="btn btn-sm btn-primary fw-bold" onclick="window.print()">
                            <i class="fas fa-print me-1"></i>Cetak / Simpan PDF
                        </button>
                    </div>
                </div>
            </div>

            <div class="paper-sheet" id="form_canvas"></div>
        </div>
    </div>
</div>

<script>
    const FORM_DEFS = [
        { id: 'f1',  code: 'FORM 1',  title: 'Surat Undangan Rapat', hasKop: true },
        { id: 'f2',  code: 'FORM 2',  title: 'BA Pertemuan / Musyawarah', hasKop: false },
        { id: 'f3',  code: 'FORM 3',  title: 'Daftar Hadir Rapat', hasKop: true },
        { id: 'f4',  code: 'FORM 4',  title: 'Notulen Rapat / Kegiatan', hasKop: true },
        { id: 'f5',  code: 'FORM 5',  title: 'Dokumentasi Kegiatan / Barang', hasKop: false },
        { id: 'f6',  code: 'FORM 6',  title: 'Database Penduduk Wilayah RT', hasKop: false, excel: true, landscape: true },
        { id: 'f7',  code: 'FORM 7',  title: 'Data Dasar Lingkungan RT (7 Tabel)', hasKop: false, landscape: true },
        { id: 'f8',  code: 'FORM 8',  title: 'BA Musyawarah Perencanaan RT', hasKop: false },
        { id: 'f9',  code: 'FORM 9',  title: 'Notulen Musyawarah Perencanaan', hasKop: false },
        { id: 'f10', code: 'FORM 10', title: 'BA Perubahan / Penambahan Sasaran', hasKop: false },
        { id: 'f11', code: 'FORM 11', title: 'Surat Pernyataan Ketua RT', hasKop: true },
        { id: 'f12', code: 'FORM 12', title: 'Formulir Usulan Program RT-Ku', hasKop: false, excel: true, landscape: true },
        { id: 'f16', code: 'FORM 16', title: 'Surat Pengajuan Usulan ke Camat', hasKop: true }
    ];

    let activeFormId = 'f1';
    let store = JSON.parse(localStorage.getItem('rtku_13forms_v3') || localStorage.getItem('rtku_13forms_v2') || '{}');
    if (!store.global) {
        store.global = { rt: '', desa: '', alamat: '', kec: '', tempat: 'Tenggarong', ketua: '', sekretaris: '', bendahara: '' };
    }
    if (!store.forms) store.forms = {};

    function saveStore() {
        localStorage.setItem('rtku_13forms_v3', JSON.stringify(store));
        updateChecklistUI();
    }

    function getF(fid) {
        if (!store.forms[fid]) store.forms[fid] = {};
        return store.forms[fid];
    }

    function setVal(fid, key, val) {
        getF(fid)[key] = val;
        saveStore();
    }

    function getVal(fid, key, def = '') {
        return getF(fid)[key] !== undefined ? getF(fid)[key] : def;
    }

    function syncGlobal() {
        store.global.rt = document.getElementById('g_rt').value;
        store.global.desa = document.getElementById('g_desa').value;
        store.global.alamat = document.getElementById('g_alamat').value;
        store.global.kec = document.getElementById('g_kec').value;
        store.global.tempat = document.getElementById('g_tempat').value;
        store.global.ketua = document.getElementById('g_ketua').value;
        store.global.sekretaris = document.getElementById('g_sekretaris').value;
        store.global.bendahara = document.getElementById('g_bendahara').value;
        saveStore();

        document.querySelectorAll('.bind-rt').forEach(el => el.textContent = store.global.rt || '....');
        document.querySelectorAll('.bind-desa').forEach(el => el.textContent = store.global.desa || '................');
        document.querySelectorAll('.bind-alamat').forEach(el => el.textContent = store.global.alamat || '........................................');
        document.querySelectorAll('.bind-kec').forEach(el => el.textContent = store.global.kec || '................');
        document.querySelectorAll('.bind-tempat').forEach(el => el.textContent = store.global.tempat || 'Tenggarong');
        document.querySelectorAll('.bind-ketua').forEach(el => el.textContent = store.global.ketua || '....................................');
        document.querySelectorAll('.bind-sekretaris').forEach(el => el.textContent = store.global.sekretaris || '....................................');
        document.querySelectorAll('.bind-bendahara').forEach(el => el.textContent = store.global.bendahara || '....................................');
    }

    function renderKopHTML() {
        const g = store.global;
        return `
            <div class="kop-surat">
                <h4>PENGURUS RT <span class="bind-rt">${g.rt || '....'}</span></h4>
                <p>Alamat <span class="bind-alamat">${g.alamat || '........................................'}</span> Kecamatan <span class="bind-kec">${g.kec || '................'}</span> Kabupaten Kutai Kartanegara</p>
            </div>
        `;
    }

    function inp(fid, key, width = '220px', hintText = '') {
        const v = String(getVal(fid, key, '')).replace(/"/g, '&quot;');
        const hintHtml = hintText ? `<span class="hint-guide no-print">${hintText}</span>` : '';
        return `<input type="text" class="paper-input" style="width:${width}" value="${v}" oninput="setVal('${fid}','${key}',this.value)">${hintHtml}`;
    }

    function txt(fid, key, rows = 3, hintText = '') {
        const v = getVal(fid, key, '');
        const hintHtml = hintText ? `<div class="hint-block no-print"><i class="fas fa-info-circle me-1"></i>${hintText}</div>` : '';
        return `${hintHtml}<textarea class="paper-textarea" rows="${rows}" oninput="autoGrow(this); setVal('${fid}','${key}',this.value)">${v}</textarea>`;
    }

    function autoGrow(el) {
        el.style.height = 'auto';
        el.style.height = (el.scrollHeight) + 'px';
    }

    function autoGrowAllTextareas() {
        document.querySelectorAll('textarea').forEach(ta => autoGrow(ta));
    }

    function isFormCompleted(fid) {
        const d = getF(fid);
        switch (fid) {
            case 'f1':  return !!(d.nomor && d.hari && d.tanggal && d.acara && d.tempat);
            case 'f2':  return !!(d.ta && d.hari && d.tanggal && d.acara && d.materi && d.keputusan);
            case 'f3':  return !!(d.nama_rapat && d.tgl_rapat && Array.isArray(d.rows) && d.rows.some(r => r.nama));
            case 'f4':  return !!(d.judul && d.hari_tgl && d.agenda && d.kesepakatan);
            case 'f5':  return !!(Array.isArray(d.slots) && d.slots.some(s => s.ket || s.img));
            case 'f6':  return !!(Array.isArray(d.penduduk) && d.penduduk.some(p => p.nama && p.nik));
            case 'f7':  return !!(d.periode && ['t1','t2','t3','t4','t5','t6','t7'].some(t => Array.isArray(d[t]) && d[t].length > 0));
            case 'f8':  return !!(d.nomor && d.hari && d.tanggal && d.identifikasi && d.alasan);
            case 'f9':  return !!(d.hari_tgl && d.pimpinan && d.notulis && d.usulan_warga);
            case 'f10': return !!(d.nama_kegiatan && d.hari && d.tanggal && d.materi);
            case 'f11': return !!(d.jabatan && store.global.ketua && store.global.rt);
            case 'f12': return !!(d.bulan && ['A','B','C','D'].some(k => Array.isArray(d[k]) && d[k].some(r => r.kegiatan)));
            case 'f16': return !!(d.nomor && d.tahun);
            default:    return false;
        }
    }

    function updateChecklistUI() {
        const nav = document.getElementById('nav_list');
        let doneCount = 0;
        nav.innerHTML = FORM_DEFS.map(f => {
            const done = isFormCompleted(f.id);
            if (done) doneCount++;
            const isAct = f.id === activeFormId;
            return `
                <div class="form-nav-item ${isAct ? 'active' : ''}" onclick="switchForm('${f.id}')">
                    <div>
                        <div class="fw-bold">${f.code}</div>
                        <div class="text-muted" style="font-size:0.78rem;">${f.title}</div>
                    </div>
                    <span class="check-badge">${done ? '✅' : '⬜'}</span>
                </div>
            `;
        }).join('');

        document.getElementById('progress_summary').textContent = `Selesai: ${doneCount} / ${FORM_DEFS.length} Form`;
        const curDef = FORM_DEFS.find(f => f.id === activeFormId);
        const curDone = isFormCompleted(activeFormId);
        document.getElementById('active_form_title').textContent = `${curDef.code} — ${curDef.title}`;
        const stBadge = document.getElementById('active_form_status');
        stBadge.textContent = curDone ? '✅ Sudah Lengkap' : 'Belum Lengkap';
        stBadge.className = curDone ? 'ms-2 badge bg-success' : 'ms-2 badge bg-secondary';

        const btnXls = document.getElementById('btn_export_xlsx');
        if (curDef.excel) btnXls.classList.remove('d-none');
        else btnXls.classList.add('d-none');

        const orientStyle = document.getElementById('dynamic_print_orientation');
        orientStyle.textContent = curDef.landscape
            ? '@media print { @page { size: landscape; margin: 10mm; } }'
            : '@media print { @page { size: portrait; margin: 14mm; } }';
    }

    function switchForm(fid) {
        activeFormId = fid;
        renderFormCanvas();
        updateChecklistUI();
        setTimeout(autoGrowAllTextareas, 30);
    }

    function addArrayItem(fid, listKey, templateObj) {
        const d = getF(fid);
        if (!Array.isArray(d[listKey])) d[listKey] = [];
        d[listKey].push({ ...templateObj });
        saveStore();
        renderFormCanvas();
        setTimeout(autoGrowAllTextareas, 20);
    }

    function delArrayItem(fid, listKey, idx) {
        const d = getF(fid);
        if (Array.isArray(d[listKey]) && d[listKey].length > 1) {
            d[listKey].splice(idx, 1);
            saveStore();
            renderFormCanvas();
            setTimeout(autoGrowAllTextareas, 20);
        }
    }

    function delTableRow(fid, listKey, idx) {
        const d = getF(fid);
        if (Array.isArray(d[listKey])) {
            d[listKey].splice(idx, 1);
            saveStore();
            renderFormCanvas();
            setTimeout(autoGrowAllTextareas, 20);
        }
    }

    function updateRowField(fid, listKey, idx, field, val) {
        const d = getF(fid);
        if (d[listKey] && d[listKey][idx]) {
            d[listKey][idx][field] = val;
            saveStore();
            if (fid === 'f12') recalcForm12();
        }
    }

    function renderNarasumberDynamic(fid, listKey = 'narasumber_list') {
        const d = getF(fid);
        if (!Array.isArray(d[listKey]) || d[listKey].length === 0) {
            d[listKey] = [{ nama: '', asal: '' }];
        }
        return d[listKey].map((ns, i) => `
            <tr>
                <td width="150">${i === 0 ? 'Narasumber' : ''}</td>
                <td width="15">${i === 0 ? ':' : ''}</td>
                <td>
                    ${i + 1}. <input type="text" class="paper-input" style="width:210px" value="${ns.nama || ''}" oninput="updateRowField('${fid}','${listKey}',${i},'nama',this.value)">
                    dari <input type="text" class="paper-input" style="width:170px" value="${ns.asal || ''}" oninput="updateRowField('${fid}','${listKey}',${i},'asal',this.value)">
                    ${i === 0
                        ? `<button type="button" class="btn btn-xs btn-outline-primary py-0 px-2 ms-1 btn-add-row" onclick="addArrayItem('${fid}','${listKey}',{nama:'',asal:''})">+ Narasumber</button>`
                        : `<button type="button" class="btn btn-xs btn-outline-danger py-0 px-1 ms-1 btn-del-row" onclick="delArrayItem('${fid}','${listKey}',${i})">×</button>`
                    }
                </td>
            </tr>
        `).join('');
    }

    function renderZigZagSignatureTable(fid, listKey, withAlamat = false) {
        const d = getF(fid);
        if (!Array.isArray(d[listKey]) || d[listKey].length === 0) {
            d[listKey] = Array.from({ length: withAlamat ? 15 : 8 }, () => ({ nama: '', jk: '', jabatan: '', alamat: '' }));
        }
        const rows = d[listKey];
        let body = '';
        for (let i = 0; i < rows.length; i++) {
            const r = rows[i];
            const no = i + 1;
            const isOdd = no % 2 === 1;
            body += `
                <tr>
                    <td class="text-center">${no}.</td>
                    <td><textarea class="cell-area" rows="1" oninput="autoGrow(this); updateRowField('${fid}','${listKey}',${i},'nama',this.value)">${r.nama || ''}</textarea></td>
                    <td><textarea class="cell-area text-center" rows="1" oninput="autoGrow(this); updateRowField('${fid}','${listKey}',${i},'jk',this.value)">${r.jk || ''}</textarea></td>
                    <td><textarea class="cell-area" rows="1" oninput="autoGrow(this); updateRowField('${fid}','${listKey}',${i},'jabatan',this.value)">${r.jabatan || ''}</textarea></td>

    function handlePhotoUpload(idx, event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const d = getF('f5');
            if (!Array.isArray(d.slots)) d.slots = [];
            d.slots[idx].img = e.target.result;
            saveStore();
            renderFormCanvas();
        };
        reader.readAsDataURL(file);
    }

    function removePhoto(idx) {
        const d = getF('f5');
        if (d.slots && d.slots[idx]) {
            d.slots[idx].img = '';
            saveStore();
            renderFormCanvas();
        }
    }

    function updatePhotoSize(idx, heightVal) {
        const d = getF('f5');
        if (d.slots && d.slots[idx]) {
            d.slots[idx].height = parseInt(heightVal) || 220;
            saveStore();
            const box = document.getElementById(`foto_box_${idx}`);
            const lbl = document.getElementById(`foto_lbl_${idx}`);
            if (box) box.style.height = `${d.slots[idx].height}px`;
            if (lbl) lbl.textContent = `${d.slots[idx].height}px`;
        }
    }

    function recalcForm12() {
        const d = getF('f12');
        let grand = 0;
        ['A', 'B', 'C', 'D'].forEach(k => {
            const sub = (d[k] || []).reduce((acc, r) => acc + (parseFloat(String(r.biaya || '0').replace(/[^0-9]/g, '')) || 0), 0);
            grand += sub;
            const el = document.getElementById(`f12_sub_${k}`);

        if (gEl) gEl.textContent = new Intl.NumberFormat('id-ID').format(grand);

                        <tr><td></td><td>4. Notulen</td><td><input type="text" class="paper-input text-center" style="width:100%;border:none" value="${getVal('f16','jd4','')}" oninput="setVal('f16','jd4',this.value)"></td><td><input type="text" class="paper-input" style="width:100%;border:none" value="${getVal('f16','kd4','')}" oninput="setVal('f16','kd4',this.value)"></td></tr>
                        <tr><td></td><td>5. Foto dokumentasi</td><td><input type="text" class="paper-input text-center" style="width:100%;border:none" value="${getVal('f16','jd5','')}" oninput="setVal('f16','jd5',this.value)"></td><td><input type="text" class="paper-input" style="width:100%;border:none" value="${getVal('f16','kd5','')}" oninput="setVal('f16','kd5',this.value)"></td></tr>
                        <tr><td></td><td>6. ${inp('f16', 'dok6', '260px')}</td><td><input type="text" class="paper-input text-center" style="width:100%;border:none" value="${getVal('f16','jd6','')}" oninput="setVal('f16','jd6',this.value)"></td><td><input type="text" class="paper-input" style="width:100%;border:none" value="${getVal('f16','kd6','')}" oninput="setVal('f16','kd6',this.value)"></td></tr>
                    </tbody>
                </table>
                <p>Demikian disampaikan, atas perhatiannya diucapkan terima kasih.</p>
                <div class="row mt-4">
                    <div class="col-7"></div>
                    <div class="col-5 text-center">
                        <div><span class="bind-tempat">${g.tempat || 'Tenggarong'}</span>, ${inp('f16', 'tgl_ttd', '150px')}</div>
                        <div>Ketua RT <span class="bind-rt">${g.rt || '....'}</span></div>
                        <div style="height:55px;"></div>
                        <div class="fw-bold">( <span class="bind-ketua">${g.ketua || '....................................'}</span> )</div>
                    </div>
                </div>
            `;
        }
    }

    async function exportCurrentExcel() {
        const wb = new ExcelJS.Workbook();
        const g = store.global;
        const border = { top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'} };

        if (activeFormId === 'f6') {
            const ws = wb.addWorksheet('Database Penduduk RT');
            ws.addRow(['DATABASE PENDUDUK DI WILAYAH RT']).font = { bold: true, size: 12 };
            ws.addRow(['RT', ':', g.rt]);
            ws.addRow(['Desa/Kelurahan', ':', g.desa]);
            ws.addRow(['Kecamatan', ':', g.kec]);
            ws.addRow([]);
            const head = ws.addRow(['No.', 'Nama Lengkap', 'NIK', 'No. KK', 'Jenis Kelamin', 'Tempat Lahir', 'Tanggal Lahir', 'Agama', 'Pendidikan', 'Pekerjaan', 'Alamat Lengkap', 'RT', 'Kelurahan/Desa', 'Kecamatan', 'Kabupaten', 'Provinsi']);
            head.eachCell(c => { c.font = { bold: true }; c.border = border; });
            (getF('f6').penduduk || []).forEach((p, idx) => {
                const r = ws.addRow([
                    idx + 1, p.nama, p.nik, p.kk, p.jk, p.tmpt, p.tgllhr, p.agama, p.pend, p.kerja, p.alamat,
                    p.rt !== undefined ? p.rt : g.rt,
                    p.desa !== undefined ? p.desa : g.desa,
                    p.kec !== undefined ? p.kec : g.kec,
                    p.kab !== undefined ? p.kab : 'Kutai Kartanegara',
                    p.prov !== undefined ? p.prov : 'Kalimantan Timur'
                ]);
                r.eachCell(c => c.border = border);
            });
            const buf = await wb.xlsx.writeBuffer();
            saveAs(new Blob([buf]), `FORM_6_Database_Penduduk_RT_${g.rt || '00'}.xlsx`);
        } else if (activeFormId === 'f12') {
            const ws = wb.addWorksheet('Formulir Usulan Program');
            ws.addRow(['FORMULIR USULAN PROGRAM RT-KU TERBAIK']).font = { bold: true, size: 12 };
            ws.addRow(['RT', ':', g.rt]);
            ws.addRow(['Desa/Kelurahan', ':', g.desa]);
            ws.addRow(['Kecamatan', ':', g.kec]);
            ws.addRow(['Bulan Pelaporan', ':', getVal('f12', 'bulan', '')]);
            ws.addRow([]);
            const head = ws.addRow(['No.', 'Nama Kegiatan', 'Latar Belakang Kebutuhan', 'Tujuan Kegiatan', 'Lokasi Kegiatan', 'Perkiraan Biaya (Rp)', 'Sumber Daya Yang Terlibat', 'Jadwal Pelaksanaan']);
            head.eachCell(c => { c.font = { bold: true }; c.border = border; });
            const d = getF('f12');
            const subCells = [];
            [['A','Ketahanan Sosial'],['B','Pemberdayaan Masyarakat'],['C','Infrastruktur'],['D','Operasional RT']].forEach(([k, nm]) => {
                const rG = ws.addRow([k, nm, '', '', '', '', '', '']);
                rG.eachCell(c => { c.font = { bold: true }; c.border = border; });
                const startR = ws.rowCount + 1;
                (d[k] || []).forEach((it, idx) => {
                    const numBiaya = parseFloat(String(it.biaya || '0').replace(/[^0-9]/g, '')) || 0;
                    const r = ws.addRow([idx + 1, it.kegiatan, it.latar, it.tujuan, it.lokasi, numBiaya, it.sumber, it.jadwal]);
                    r.getCell(6).numFmt = '#,##0';
                    r.eachCell(c => c.border = border);
                });
                const endR = ws.rowCount;
                const rSub = ws.addRow(['', `Sub Total ${k}`, '', '', '', { formula: `SUM(F${startR}:F${endR})` }, '', '']);
                rSub.eachCell(c => { c.font = { bold: true }; c.border = border; });
                rSub.getCell(6).numFmt = '#,##0';
                subCells.push(`F${rSub.number}`);
            });
            const rTot = ws.addRow(['', 'Total Keseluruhan (A, B, C, D)', '', '', '', { formula: subCells.join('+') }, '', '']);
            rTot.eachCell(c => { c.font = { bold: true }; c.border = border; });
            rTot.getCell(6).numFmt = '#,##0';
            const buf = await wb.xlsx.writeBuffer();
            saveAs(new Blob([buf]), `FORM_12_Usulan_Program_RT_${g.rt || '00'}.xlsx`);
        }
    }

    function resetAllData() {
        if (confirm('Hapus seluruh isian pada ke-13 form dan mulai dari awal?')) {
            localStorage.removeItem('rtku_13forms_v3');
            localStorage.removeItem('rtku_13forms_v2');
            location.reload();
        }
    }

    window.addEventListener('beforeprint', autoGrowAllTextareas);
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('g_rt').value = store.global.rt || '';
        document.getElementById('g_desa').value = store.global.desa || '';
        document.getElementById('g_alamat').value = store.global.alamat || '';
        document.getElementById('g_kec').value = store.global.kec || '';
        document.getElementById('g_tempat').value = store.global.tempat || 'Tenggarong';
        document.getElementById('g_ketua').value = store.global.ketua || '';
        document.getElementById('g_sekretaris').value = store.global.sekretaris || '';
        document.getElementById('g_bendahara').value = store.global.bendahara || '';
        switchForm('f1');
    });
</script>
